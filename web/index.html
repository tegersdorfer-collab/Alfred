<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<link rel="manifest" href="/manifest.json">
<title>Alfred</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0a0f1e; --card:#121a2e; --card2:#1a2540; --line:#1f2c4a; --accent:#3b82f6; --accent2:#8b5cf6; --muted:#7c8db5; }
  * { -webkit-tap-highlight-color:transparent; box-sizing:border-box; }
  body { background:radial-gradient(1200px 700px at 50% -10%, #16213f 0%, var(--bg) 55%); color:#e8eefc;
         font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif; margin:0; overscroll-behavior:none; }
  .card { background:linear-gradient(160deg,var(--card) 0%,#0f1729 100%); border:1px solid var(--line); border-radius:20px; }
  .soft { background:rgba(26,37,64,.35); border:none; border-radius:18px; }
  .glass { backdrop-filter:blur(20px); background:rgba(10,15,30,.82); }
  .grad-text { background:linear-gradient(120deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent; }
  .btn { background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:14px;padding:11px 16px;font-weight:600;font-size:14px;transition:.15s;cursor:pointer; }
  .btn:active{transform:scale(.96);}
  .btn-ghost{background:var(--card2);color:#c7d2fe;border:none;cursor:pointer;}
  .chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11px;color:#a5b4fc;}
  .jring{transform:rotate(-90deg);box-shadow:none!important;}
  input,textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:12px;color:#e8eefc;padding:11px 13px;font-size:15px;width:100%;outline:none;}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  ::-webkit-scrollbar{width:0;height:0;}
  .fade{animation:fade .35s ease;}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .pill-h{height:8px;border-radius:999px;background:var(--card2);overflow:hidden;}
  .pill-f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .5s;}
  .heat{width:11px;height:11px;border-radius:3px;background:#1a2540;}
  .msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;}
  .msg-u{background:linear-gradient(120deg,var(--accent),#2563eb);color:#fff;border-bottom-right-radius:5px;margin-left:auto;}
  .msg-a{background:var(--card2);color:#e8eefc;border-bottom-left-radius:5px;}

  /* Layout */
  .shell{display:flex;min-height:100vh;}
  .sidebar{display:none;}
  .main{flex:1;min-width:0;}
  .app{max-width:560px;margin:0 auto;padding-bottom:96px;}
  .header{position:sticky;top:0;z-index:40;padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line);}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:50;}
  .nav-inner{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
  .nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#5b6b8c;background:none;border:none;padding:4px 10px;cursor:pointer;}
  .nav-btn.active{color:#fff;}
  .nav-btn.active .ni{background:linear-gradient(120deg,var(--accent),var(--accent2));box-shadow:0 4px 14px rgba(59,130,246,.5);}
  .ni{width:42px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.2s;}
  .sheet{position:fixed;inset:0;z-index:60;display:none;}
  .sheet.open{display:block;}
  .sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);}
  .sheet-card{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;background:var(--card);border-top:1px solid var(--line);padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s;max-height:88vh;overflow-y:auto;}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .tabbar{display:flex;gap:6px;margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:12px;background:var(--card2);color:var(--muted);font-size:13px;cursor:pointer;}
  .tab.active{background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;}

  /* Live-Status */
  .status-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:14px;background:rgba(26,37,64,.5);border:1px solid var(--line);font-size:12px;color:#9fb0d6;transition:.3s;}
  .status-bar.thinking{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.08);}
  .status-bar.tool{border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.08);}
  .status-bar.memory{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.08);}
  .status-bar.learning{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06);}
  .status-bar.error{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08);}
  .status-bar.task_working{border-color:rgba(165,180,252,.4);background:rgba(165,180,252,.08);}
  .sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#475569;transition:.3s;}
  .sdot.task_working{background:#a5b4fc;animation:pulse-indigo 1s infinite;}
  .sdot.thinking{background:#3b82f6;animation:pulse-blue 1.2s infinite;}
  .sdot.tool{background:#8b5cf6;animation:pulse-purple 1s infinite;}
  .sdot.memory{background:#22c55e;}
  .sdot.learning{background:#fbbf24;animation:pulse-yellow 1.4s infinite;}
  .sdot.idle{background:#22c55e;}
  .sdot.error{background:#ef4444;}
  @keyframes pulse-blue{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.6)}50%{box-shadow:0 0 0 5px rgba(59,130,246,0)}}
  @keyframes pulse-purple{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.6)}50%{box-shadow:0 0 0 5px rgba(139,92,246,0)}}
  @keyframes pulse-yellow{0%,100%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}50%{box-shadow:0 0 0 5px rgba(251,191,36,0)}}
  @keyframes pulse-indigo{0%,100%{box-shadow:0 0 0 0 rgba(165,180,252,.6)}50%{box-shadow:0 0 0 5px rgba(165,180,252,0)}}
  .act-row{display:flex;gap:8px;padding:5px 0;font-size:12px;color:#9fb0d6;border-bottom:1px solid rgba(31,44,74,.6);animation:fade .2s ease;}
  .act-row:last-child{border-bottom:none;}

  /* Desktop */
  @media(min-width:900px){
    .app{max-width:1100px;padding:0 28px 40px;}
    .nav{display:none;}
    .sidebar{display:flex;flex-direction:column;width:230px;flex-shrink:0;border-right:1px solid var(--line);
             padding:20px 14px;position:sticky;top:0;height:100vh;gap:4px;}
    .side-btn{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:#9fb0d6;background:none;border:none;font-size:14px;cursor:pointer;text-align:left;width:100%;}
    .side-btn:hover{background:var(--card2);}
    .side-btn.active{background:linear-gradient(120deg,rgba(59,130,246,.25),rgba(139,92,246,.2));color:#fff;}
    .header{border-bottom:none;padding-top:24px;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;align-items:start;}
    .chat-wrap{max-width:760px;}
    .sheet-card{max-width:560px;border-radius:24px;bottom:auto;top:50%;left:50%;right:auto;transform:translate(-50%,-50%);}
    @keyframes up{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="shell">
  <!-- Desktop Sidebar -->
  <aside class="sidebar">
    <div style="display:flex;align-items:center;gap:11px;padding:6px 10px 18px">
      <div style="width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:19px">🤖</div>
      <div><div style="font-weight:700">Alfred</div><div id="sideStatus" style="font-size:11px;color:var(--muted)">…</div></div>
    </div>
    <div id="sideNav" style="flex:1;overflow-y:auto"></div>
  </aside>

  <div class="main">
    <div class="app">
      <div class="header glass" id="topHeader">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:11px">
            <div class="hmob" style="width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px">🤖</div>
            <div><div style="font-weight:700;font-size:18px" id="hello">Alfred</div><div style="font-size:11px;color:var(--muted)" id="sub">verbinde…</div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span id="dot" style="width:9px;height:9px;border-radius:50%;background:#475569"></span>
            <span id="clock" style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums"></span>
          </div>
        </div>
      </div>
      <div id="view" style="padding:16px 0"></div>
    </div>
  </div>
</div>

<!-- Bottom Nav (mobile) -->
<div class="nav glass">
  <div class="nav-inner">
    <button class="nav-btn" data-v="home"><div class="ni">🏠</div>Home</button>
    <button class="nav-btn" data-v="chat"><div class="ni">💬</div>Chat</button>
    <button class="nav-btn" data-v="body"><div class="ni">💪</div>Körper</button>
    <button class="nav-btn" data-v="habits"><div class="ni">🔥</div>Habits</button>
    <button class="nav-btn" data-v="more"><div class="ni">⋯</div>Mehr</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet-card" id="sheetCard"></div></div>

<script>
const API=location.origin; let CUR='home'; let charts={};
const NAV=[['home','🏠','Home'],['chat','💬','Chat'],['body','💪','Körper'],['habits','🔥','Habits'],
  ['tasks','✅','Aufgaben'],['calendar','📅','Kalender'],['nutrition','🍽️','Ernährung'],
  ['journal','📖','Journal'],['goals','🎯','Ziele'],['memory','🧠','Gedächtnis'],
  ['mind','🌌','Alfred Mind'],['analytics','📊','Analytics'],['settings','⚙️','Einstellungen']];

const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};
const view=()=>$('#view');
async function api(p,o){const r=await fetch(API+p,o);return r.json();}
async function post(p,b){return api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});}
async function del(p){return api(p,{method:'DELETE'});}
function esc(s){return(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code style="background:#0b1220;padding:1px 5px;border-radius:5px">$1</code>');}
function toast(t){const x=el(`<div style="position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);color:#e8eefc;padding:10px 18px;border-radius:14px;z-index:90;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4)">${esc(t)}</div>`);document.body.appendChild(x);setTimeout(()=>x.remove(),1900);}
function confirmAction(text,onyes){sheet(`<div style="width:40px;height:4px;background:#33415a;border-radius:99px;margin:0 auto 16px"></div><div style="font-size:16px;margin-bottom:18px;text-align:center">${esc(text)}</div><div style="display:flex;gap:10px"><button class="btn-ghost" style="flex:1;padding:12px;border-radius:13px" onclick="closeSheet()">Abbrechen</button><button class="btn" style="flex:1;background:linear-gradient(120deg,#ef4444,#dc2626)" id="cfYes">Löschen</button></div>`);$('#cfYes').onclick=()=>{closeSheet();onyes();};}
function ring(pct,size=64,stroke=7,color='#3b82f6'){const r=(size-stroke)/2,c=2*Math.PI*r,off=c*(1-Math.min(1,pct||0));return `<svg width="${size}" height="${size}" class="jring"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="#1a2540" stroke-width="${stroke}" fill="none"/><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;}
function sheet(h){$('#sheetCard').innerHTML=h;$('#sheet').classList.add('open');}
function closeSheet(){$('#sheet').classList.remove('open');}

setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});},1000);
async function status(){try{const s=await api('/api/status');$('#dot').style.background=s.running?'#22c55e':'#ef4444';const t=`${s.running?'Online':'Offline'} · ${s.model} · ${s.tools} Tools`;$('#sub').textContent=t;const ss=$('#sideStatus');if(ss)ss.textContent=t;const h=new Date().getHours();$('#hello').textContent=h<11?'Guten Morgen':h<18?'Hallo Timo':'Guten Abend';}catch(e){}}
status();setInterval(status,60000);

// ── Live-Status-Stream ────────────────────────────────────────────────────────
const STATUS_ICONS={thinking:'💭',tool:'🔧',memory:'🧠',learning:'💡',idle:'✅',autopilot:'🤖',error:'⚠️',task_working:'⚙️'};
const STATUS_LABELS={thinking:'Denkt…',tool:'Tool',memory:'Erinnerung',learning:'Lernt',idle:'Bereit',autopilot:'Autopilot',error:'Fehler',task_working:'Arbeitet…'};
const MODEL_BADGES={
  'claude-haiku-4-5-20251001':'<span style="font-size:10px;background:#1a3a2a;color:#4ade80;padding:1px 6px;border-radius:99px;margin-left:6px">Haiku ⚡</span>',
  'gemma4:31b-mlx':'<span style="font-size:10px;background:#1e2a3a;color:#60a5fa;padding:1px 6px;border-radius:99px;margin-left:6px">Gemma4 🧠</span>',
  'qwen3.5:9b':'<span style="font-size:10px;background:#2a1a3a;color:#c084fc;padding:1px 6px;border-radius:99px;margin-left:6px">Qwen 🔧</span>',
};
function modelBadge(m){return MODEL_BADGES[m]||'';}
let _activeModel='';
let _actLog=[]; // letzten N Status-Events für Activity-Feed
let _actSeen=new Set(); // Dedup: bereits gesehene Event-Timestamps

function applyStatus(evt){
  if(evt.keepalive) return;
  const type=evt.type||'idle';
  const text=evt.text||'';
  const detail=evt.detail||'';

  // Modell aus detail extrahieren und merken
  if(detail && MODEL_BADGES[detail]) _activeModel=detail;

  const badge=_activeModel?modelBadge(_activeModel):'';
  const fullText=`${STATUS_ICONS[type]||'·'} ${text}${detail&&!MODEL_BADGES[detail]?' · '+detail:''}`;

  // Dot in Header
  const dot=$('#dot');
  if(dot){dot.style.background=type==='idle'?'#22c55e':type==='error'?'#ef4444':'#3b82f6';}

  // Sub-Zeile Header
  const sub=$('#sub');
  if(sub&&type!=='idle') sub.innerHTML=fullText+badge;

  // Sidebar
  const ss=$('#sideStatus');
  if(ss&&type!=='idle') ss.textContent=`${STATUS_ICONS[type]||'·'} ${text}`;

  // Home-Status-Bar
  const bar=$('#homeStatus');
  if(bar){
    bar.className=`status-bar ${type}`;
    const sdot=bar.querySelector('.sdot');
    if(sdot) sdot.className=`sdot ${type}`;
    const stxt=bar.querySelector('.stxt');
    if(stxt) stxt.innerHTML=fullText+badge;
  }

  // Activity-Log Buffer – mit Dedup über Timestamp
  if(type!=='idle'){
    const ts=evt.ts||Date.now()/1000;
    // Schlüssel: ts + type + text (gleicher Event kann in verschiedenen Sekunden kommen)
    const key=`${Math.round(ts*10)}|${type}|${text}`;
    if(!_actSeen.has(key)){
      _actSeen.add(key);
      // Set begrenzen damit er nicht unbegrenzt wächst
      if(_actSeen.size>200){
        const oldest=[..._actSeen].slice(0,50);
        oldest.forEach(k=>_actSeen.delete(k));
      }
      _actLog.unshift({...evt, ts});
      if(_actLog.length>50) _actLog=_actLog.slice(0,50);
      // Live-Feed in Mind-View einblenden falls offen
      const feed=$('#actFeed');
      if(feed){
        const row=el(`<div class="act-row"><span>${STATUS_ICONS[type]||'·'}</span><span style="flex:1;color:#c7d2fe">${esc(text)}${detail?` <span style="color:var(--muted)">${esc(detail)}</span>`:''}</span><span style="color:#4a5980">${new Date(ts*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`);
        feed.prepend(row);
        while(feed.children.length>60) feed.lastChild.remove();
      }
    }
  }
}

function startStatusStream(){
  const es=new EventSource(`${API}/api/status/stream`);
  es.onmessage=ev=>{try{applyStatus(JSON.parse(ev.data));}catch(e){}};
  es.onerror=()=>setTimeout(startStatusStream, 5000); // reconnect
}
startStatusStream();

// Build sidebar
function buildSidebar(){const c=$('#sideNav');c.innerHTML=NAV.map(i=>`<button class="side-btn" data-v="${i[0]}"><span style="font-size:17px">${i[1]}</span> ${i[2]}</button>`).join('');c.querySelectorAll('.side-btn').forEach(b=>b.onclick=()=>go(b.dataset.v));}
buildSidebar();

const VIEWS={};
function go(v){
  if(v==='more'){openMore();return;}
  // Cleanup vorheriger View (z.B. Mind-Patch)
  const prev=view().firstChild;if(prev&&prev._cleanup)prev._cleanup();
  CUR=v;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.querySelectorAll('.side-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  view().innerHTML='';const root=el('<div class="fade"></div>');view().appendChild(root);
  (VIEWS[v]||(()=>{}))(root);
}
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>go(b.dataset.v));
function openMore(){const items=NAV.slice(4);sheet(`<div style="width:40px;height:4px;background:#33415a;border-radius:99px;margin:0 auto 16px"></div><div style="font-weight:700;font-size:18px;margin-bottom:14px">Mehr</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">${items.map(i=>`<button class="soft" style="padding:18px 8px;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer" onclick="closeSheet();go('${i[0]}')"><span style="font-size:26px">${i[1]}</span><span style="font-size:12px;color:#c7d2fe">${i[2]}</span></button>`).join('')}</div>`);}
function feedIcon(t){return {thought:'💭',action:'⚡',tool:'🔧',reflection:'🪞',briefing:'☀️',review:'🌙',reminder:'⏰',health:'🩺',system:'⚙️'}[t]||'•';}

// ════════ HOME (clean, kein Box-Rahmen-Overkill) ════════
VIEWS.home=async(root)=>{
  root.innerHTML=`<div id="h-top"></div>
    <div id="h-rings" style="margin-top:18px"></div>
    <div id="h-quick" style="margin-top:18px"></div>
    <div id="h-status" style="margin-top:12px"></div>
    <div class="grid2"><div id="h-left"></div><div id="h-right"></div></div>`;
  const ov=await api('/api/overview');
  // Wetter – nahtlos, ohne Box
  try{const w=await api('/api/weather');if(!w.error){const n=w.now,f=w.forecast||[];
    $('#h-top').appendChild(el(`<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 6px">
      <div><div style="font-size:13px;color:var(--muted)">${w.city}</div><div style="font-size:38px;font-weight:800;line-height:1">${Math.round(n.temp)}°</div><div style="font-size:13px;color:#a5b4fc">${n.desc}, gefühlt ${Math.round(n.feels)}°</div></div>
      <div style="text-align:right;font-size:12px;color:var(--muted);line-height:1.7">${f.slice(0,3).map(d=>`<div>${new Date(d.date).toLocaleDateString('de',{weekday:'short'})} &nbsp;${Math.round(d.min)}–${Math.round(d.max)}° &nbsp;💧${d.rain_prob??0}%</div>`).join('')}</div>
    </div>`));}}catch(e){}
  // Rings – nahtlos
  // health[0] = heute (Schlaf letzte Nacht ✓, Schritte erst abends ✗)
  // health[1] = gestern (Schritte vollständig ✓, Ruhepuls ✓)
  const hd=(ov.health&&ov.health[0])||{};
  const hdY=(ov.health&&ov.health[1])||{}; // gestern
  const stepsVal=hdY.steps||0;
  const stepsLabel=stepsVal?(stepsVal.toLocaleString('de')+' gest.'):'–';
  // Ruhepuls: gestern bevorzugen, Fallback heute. Ring-Füllstand: 40bpm=voll, 80bpm=leer
  const hrVal=hdY.resting_hr||hd.resting_hr;
  const hrFill=hrVal?Math.min(1,Math.max(0,(80-hrVal)/40)):0;
  $('#h-rings').appendChild(el(`<div style="display:flex;justify-content:space-around;text-align:center">
    ${ringStat(Math.min(1,stepsVal/10000),'👟',stepsLabel,'#3b82f6')}

    <button class="soft" style="padding:13px 4px;font-size:11px;cursor:pointer" onclick="go('body')">＋ Training</button>

    <span class="sdot ${hsType}"></span>
    <span class="stxt" style="flex:1">${STATUS_ICONS[hsType]||'·'} ${esc(hsCur.text||'Bereit')}${hsCur.detail?' · '+esc(hsCur.detail):''}</span>
    <span style="font-size:11px;color:#4a5980">Alfred Aktivität ›</span>
  </div>`));
  const L=$('#h-left'),R=$('#h-right');
  // Habits
  if(ov.habits&&ov.habits.length){const done=ov.habits.filter(h=>h.today_done).length;
    L.appendChild(el(`<div style="margin-top:22px;padding:0 2px"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><b>Gewohnheiten</b><span class="chip">${done}/${ov.habits.length}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${ov.habits.map(h=>`<button onclick="toggleHabit(${h.id},${h.today_done})" class="${h.today_done?'':'soft'}" style="border:none;border-radius:12px;padding:8px 11px;font-size:13px;cursor:pointer;${h.today_done?'background:linear-gradient(120deg,#22c55e,#16a34a);color:#fff':''}">${h.emoji} ${esc(h.name)} <span style="opacity:.7;font-size:11px">🔥${h.streak}</span></button>`).join('')}</div></div>`));}

  if(ov.goals&&ov.goals.length){

  try{const m=await api('/api/mind');R.appendChild(el(`<div style="margin-top:22px;padding:0 2px"><b>Alfred Aktivität</b>${(m.events||[]).slice(0,6).map(e=>`<div style="display:flex;gap:8px;padding:5px 0;font-size:12px;color:#9fb0d6"><span>${feedIcon(e.type)}</span><span style="flex:1">${esc(e.summary)}</span></div>`).join('')||'<div style="color:#5b6b8c;font-size:13px;margin-top:8px">Noch ruhig…</div>'}</div>`));}catch(e){}
};
function ringStat(p,icon,val,col){return `<div style="position:relative;border:none!important;background:none!important;outline:none!important;box-shadow:none!important">${ring(p,76,8,col)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:16px">${icon}</div><div style="font-size:13px;font-weight:700">${val}</div></div></div>`;}
function taskRow(t,compact){const pr={high:'🔴',medium:'🟡',low:'🟢'};const hasSub=t.subtasks&&t.subtasks.length;return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0"><button onclick="event.stopPropagation();completeTask(${t.id})" style="width:20px;height:20px;border-radius:6px;border:2px solid #3b5;background:none;cursor:pointer;flex-shrink:0"></button><div style="flex:1;min-width:0"><div style="font-size:14px">${esc(t.title)} ${hasSub?`<span class="chip" style="font-size:10px">${t.progress_pct}%</span>`:''}</div>${hasSub&&!compact?`<div class="pill-h" style="margin-top:5px"><div class="pill-f" style="width:${t.progress_pct}%"></div></div>`:''}</div>${t.due?`<span class="chip">${fmtDue(t.due)}</span>`:''}<span>${pr[t.priority]||''}</span></div>`;}
function fmtDue(d){try{return new Date(d).toLocaleDateString('de',{day:'2-digit',month:'2-digit'});}catch(e){return '';}}

// ════════ CHAT (mobil-fix: eigenes Flex-Layout) ════════
VIEWS.chat=async(root)=>{
  root.innerHTML=`<div class="chat-wrap" style="display:flex;flex-direction:column;height:calc(100vh - 150px);max-height:calc(100vh - 150px)">
    <div id="cmsgs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px"></div>
    <div style="display:flex;gap:8px;padding:8px 0 4px;background:var(--bg)">
      <textarea id="cin" rows="1" placeholder="Schreib Alfred…" style="flex:1;resize:none;max-height:120px" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
      <button class="btn" onclick="sendChat()" style="padding:0 18px">➤</button>
    </div></div>`;
  const box=$('#cmsgs');
  const hist=await api('/api/chat/history?limit=40');
  hist.forEach(m=>box.appendChild(chatBubble(m.role,m.content)));
  box.scrollTop=box.scrollHeight;
  const ta=$('#cin');ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(120,ta.scrollHeight)+'px';});
};
function chatBubble(role,content){return el(`<div class="msg ${role==='user'?'msg-u':'msg-a'}">${md(content)}</div>`);}
async function sendChat(){
  const inp=$('#cin');const text=inp.value.trim();if(!text)return;inp.value='';inp.style.height='auto';
  const box=$('#cmsgs');box.appendChild(chatBubble('user',text));
  const a=chatBubble('assistant','…');box.appendChild(a);box.scrollTop=box.scrollHeight;
  try{
    const es=new EventSource(`${API}/api/chat/stream?text=${encodeURIComponent(text)}`);
    es.onmessage=(ev)=>{const d=JSON.parse(ev.data);
      if(d.partial){a.innerHTML=md(d.partial);}
      if('done' in d){a.innerHTML=md(d.done);if(d.tools&&d.tools.length){a.appendChild(el(`<div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${d.tools.map(t=>`<span class="chip">🔧 ${t}</span>`).join('')}</div>`));}es.close();}
      box.scrollTop=box.scrollHeight;};
    es.onerror=()=>es.close();
  }catch(e){a.innerHTML='Fehler.';}
}

VIEWS.body=async(root)=>{

  $('#b-cards').appendChild(el(`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${card('😴','Schlaf',last.sleep?last.sleep.toFixed(1):'–','h')}${card('👟','Schritte',stepsYest,'','gestern')}${card('❤️','Ruhepuls',lastBpm,'bpm')}<div class="card" style="padding:10px;text-align:center;cursor:pointer" onclick="logHRV()"><div style="font-size:20px">📊</div><div style="font-size:11px;color:var(--muted);margin-top:2px">HRV</div><div style="font-size:18px;font-weight:700;margin-top:2px">${hrvVal}</div><div style="font-size:10px;color:#6366f1;margin-top:3px">+ eintragen</div></div>${card('🔥','Aktiv',kcalYest,'kcal','gestern')}${card('⚖️','Gewicht',lastWeight,'kg')}</div>`));
  const rev=[...h].reverse();
  lineChart('cSleep',rev.map(x=>x.date?.slice(5)),[{label:'Schlaf',data:rev.map(x=>x.sleep),color:'#8b5cf6'}]);
  lineChart('cWeight',rev.filter(x=>x.weight).map(x=>x.date?.slice(5)),[{label:'kg',data:rev.filter(x=>x.weight).map(x=>x.weight),color:'#3b82f6'}]);
  // Muscle body

  const wo=await api('/api/workouts?limit=10');
  $('#b-wo').appendChild(el(`<div class="card" style="padding:16px"><b>Letzte Trainings</b>${wo.length?wo.map(w=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><div style="font-weight:600">${esc(w.title)}</div><span class="chip">${fmtDue(w.date)}</span></div><div style="font-size:11px;color:var(--muted)">${w.type}${w.distance_km?' · '+w.distance_km+'km':''}${w.duration_min?' · '+w.duration_min+'min':''}</div>${(w.sets&&w.sets.length)?`<div style="font-size:12px;color:#9fb0d6;margin-top:4px">${w.sets.map(s=>`${esc(s.exercise||'?')} ${s.reps||''}×${s.weight_kg||''}kg`).join(' · ')}</div>`:''}</div>`).join(''):'<div style="color:#5b6b8c;font-size:13px;margin-top:8px">Noch keine Trainings.</div>'}</div>`));

    <ellipse cx="142" cy="86" rx="19" ry="15" fill="${col('shoulders')}" stroke="${O}" stroke-width="1"/>
    <!-- Brust (Pecs) -->
    <path d="M100 72 C82 72 70 80 69 96 C68 108 84 112 100 109 Z" fill="${col('chest')}" stroke="${O}" stroke-width="1"/>
    <path d="M100 72 C118 72 130 80 131 96 C132 108 116 112 100 109 Z" fill="${col('chest')}" stroke="${O}" stroke-width="1"/>
    <!-- Bizeps -->
    <ellipse cx="50" cy="120" rx="12" ry="27" fill="${col('arms')}" stroke="${O}" stroke-width="1"/>
    <ellipse cx="150" cy="120" rx="12" ry="27" fill="${col('arms')}" stroke="${O}" stroke-width="1"/>
    <!-- Unterarme -->
    <ellipse cx="43" cy="166" rx="10" ry="25" fill="${col('arms')}" opacity="0.8"/>
    <ellipse cx="157" cy="166" rx="10" ry="25" fill="${col('arms')}" opacity="0.8"/>
    <!-- Bauch / Core -->
    <path d="M82 112 h36 q3 0 3 4 l-2 56 q-19 8 -38 0 l-2 -56 q0 -4 3 -4 z" fill="${col('core')}" stroke="${O}" stroke-width="1"/>
    <g stroke="#0e1626" stroke-width="1.6" opacity="0.55">
      <line x1="100" y1="116" x2="100" y2="168"/>

    <!-- Quads -->
    <path d="M83 176 q-8 44 -2 84 q4 12 14 9 q6 -2 6 -13 l-2 -80 z" fill="${col('legs')}" stroke="${O}" stroke-width="1"/>
    <path d="M117 176 q8 44 2 84 q-4 12 -14 9 q-6 -2 -6 -13 l2 -80 z" fill="${col('legs')}" stroke="${O}" stroke-width="1"/>
    <!-- Waden -->
    <path d="M86 266 q-5 38 2 62 q4 9 10 3 l1 -64 z" fill="${col('legs')}" opacity="0.8"/>

// ════════ HABITS (toggle, delete, commit graph) ════════
VIEWS.habits=async(root)=>{
  const DAYS=14;
  const CATS=[
    {key:'morning',label:'🌅 Morning Routine',color:'#f59e0b',bg:'rgba(245,158,11,0.08)'},
    {key:'day',    label:'☀️ Rest of Day',    color:'#3b82f6',bg:'rgba(59,130,246,0.08)'},
    {key:'evening',label:'🌙 Evening Routine',color:'#8b5cf6',bg:'rgba(139,92,246,0.08)'},
  ];
  root.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><b style="font-size:18px">Routinen</b><button class="btn" onclick="addHabit()" style="padding:8px 14px;font-size:13px">＋ Neu</button></div><div id="hbody"></div>`;
  const [hs,cm]=await Promise.all([api('/api/habits'),api('/api/habits/commit?days='+DAYS)]);
  const body=$('#hbody');

  // Commit-Bar
  if(cm.length){
    const avg=Math.round(cm.reduce((a,b)=>a+b.pct,0)/cm.length);
    const barsHtml=cm.map(d=>`<div title="${d.date}: ${d.pct}%" style="flex:1;height:${Math.max(3,d.pct*0.36)}px;border-radius:2px 2px 0 0;align-self:flex-end;background:${d.pct>=100?'#22c55e':d.pct>=50?'#3b82f6':d.pct>0?'#334155':'#1a2540'}"></div>`).join('');
    body.insertAdjacentHTML('beforeend',`<div class="card" style="padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px"><svg width="44" height="44" viewBox="0 0 44 44" style="flex-shrink:0"><circle cx="22" cy="22" r="18" fill="none" stroke="#1e293b" stroke-width="4"/><circle cx="22" cy="22" r="18" fill="none" stroke="${avg>=80?'#22c55e':avg>=50?'#3b82f6':'#f59e0b'}" stroke-width="4" stroke-dasharray="${Math.round(avg*1.13)} 113" stroke-linecap="round" transform="rotate(-90 22 22)"/><text x="22" y="27" text-anchor="middle" font-size="10" fill="#e2e8f0" font-weight="bold">${avg}%</text></svg><div style="flex:1;display:flex;gap:2px;align-items:flex-end;height:36px">${barsHtml}</div></div>`);
  }

  if(!hs.length){body.insertAdjacentHTML('beforeend','<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">Noch keine Routinen – leg welche an!</div>');return;}

  // Datumsspalten
  const today=new Date();
  const dateCols=[];
  for(let i=DAYS;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);dateCols.push(d.toISOString().slice(0,10));}
  // Spalten: [Handle 18px] [Streak 32px] [Name ~140px] [14 past dots flex] [heute 38px] [X 28px]
  const COLS=`18px 32px minmax(100px,140px) repeat(${DAYS},1fr) 38px 28px`;

  // Eine gemeinsame Card für alle Kategorien
  const masterCard=document.createElement('div');
  masterCard.className='card';masterCard.style.cssText='padding:0;overflow:hidden';

  // Datums-Header (einmalig ganz oben)
  const hdrRow=document.createElement('div');
  hdrRow.style.cssText=`display:flex;align-items:center;border-bottom:1px solid #1e293b`;
  // Platz für vertikales Label
  hdrRow.insertAdjacentHTML('beforeend','<div style="width:28px;flex-shrink:0"></div>');
  // Grid-Header
  const hdrGrid=document.createElement('div');
  hdrGrid.style.cssText=`flex:1;display:grid;grid-template-columns:${COLS};align-items:center;padding:0 6px 0 8px`;
  hdrGrid.insertAdjacentHTML('beforeend','<div></div>');
  hdrGrid.insertAdjacentHTML('beforeend','<div style="text-align:center;font-size:9px;color:#475569;padding:5px 0">🔥</div>');
  hdrGrid.insertAdjacentHTML('beforeend','<div style="font-size:10px;color:#475569;padding:5px 0 5px 4px">Routine</div>');
  for(let i=0;i<DAYS;i++){
    const dt=new Date(dateCols[i]);
    const lbl=['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()];
    const isMon=lbl==='Mo';
    hdrGrid.insertAdjacentHTML('beforeend',`<div style="text-align:center;font-size:9px;color:${isMon?'#64748b':'#2d3f5a'};padding:5px 0;${isMon?'border-left:1px solid #1e293b':''}">${isMon||lbl==='So'?lbl:''}</div>`);
  }
  hdrGrid.insertAdjacentHTML('beforeend',`<div style="text-align:center;font-size:10px;font-weight:700;color:#94a3b8;padding:5px 0">Heu</div>`);
  hdrGrid.insertAdjacentHTML('beforeend','<div></div>');
  hdrRow.appendChild(hdrGrid);
  masterCard.appendChild(hdrRow);

  CATS.forEach((cat,ci)=>{
    const inCat=hs.filter(h=>(h.category||'day')===cat.key);
    if(!inCat.length)return;
    const doneToday=inCat.filter(h=>h.today_done).length;

    // Trennlinie zwischen Sektionen
    if(ci>0) masterCard.insertAdjacentHTML('beforeend',`<div style="height:2px;background:linear-gradient(90deg,${cat.color}44,transparent)"></div>`);

    // Sektion: vertikales Label links + Habit-Zeilen rechts
    const section=document.createElement('div');
    section.style.cssText='display:flex;align-items:stretch';

    // Vertikales Kategorie-Label
    const label=document.createElement('div');
    label.style.cssText=`width:28px;flex-shrink:0;background:${cat.bg};display:flex;align-items:center;justify-content:center;border-right:2px solid ${cat.color}44;cursor:default`;
    const labelInner=document.createElement('div');
    labelInner.style.cssText=`writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;color:${cat.color};letter-spacing:.5px;padding:8px 0;user-select:none;display:flex;align-items:center;gap:4px`;
    labelInner.innerHTML=`<span>${cat.label.split(' ').slice(1).join(' ')}</span>`;
    // Chip mit done/total unten
    const chip=document.createElement('span');
    chip.style.cssText=`font-size:9px;opacity:.7;font-weight:400`;
    chip.textContent=`${doneToday}/${inCat.length}`;
    labelInner.appendChild(chip);
    label.appendChild(labelInner);
    section.appendChild(label);

    // Habit-Zeilen
    const rows=document.createElement('div');
    rows.style.cssText='flex:1;min-width:0';

    // Drag & Drop state für diese Sektion
    let dragSrc=null;
    function saveCatOrder(){
      const payload=[...rows.querySelectorAll('[data-hid]')].map((el,i)=>({id:+el.dataset.hid,sort_order:i}));
      fetch('/api/habits/reorder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }

    inCat.forEach((h,hi)=>{
      const row=document.createElement('div');
      row.dataset.hid=h.id;
      row.draggable=false; // nur per Handle aktivierbar
      row.style.cssText=`display:grid;grid-template-columns:${COLS};align-items:center;padding:0 6px 0 4px;border-top:1px solid #0f172a;background:${hi%2?'rgba(255,255,255,0.012)':'transparent'};transition:opacity .15s`;
      row.addEventListener('dragstart',e=>{if(!row.draggable)return e.preventDefault();dragSrc=row;e.dataTransfer.effectAllowed='move';setTimeout(()=>row.style.opacity='0.35',0);});
      row.addEventListener('dragend',()=>{row.draggable=false;row.style.opacity='1';saveCatOrder();});
      row.addEventListener('dragover',e=>{if(!dragSrc)return;e.preventDefault();if(dragSrc!==row){const mid=row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;rows.insertBefore(dragSrc,e.clientY<mid?row:row.nextSibling);}});

      // Drag Handle — setzt draggable nur bei Mousedown auf Handle
      const handle=document.createElement('div');
      handle.style.cssText='display:flex;align-items:center;justify-content:center;cursor:grab;color:#2d3f5a;font-size:14px;padding:0 2px;user-select:none;line-height:1';
      handle.innerHTML='<span style="letter-spacing:-1px">⠿</span>';
      handle.onmouseenter=()=>handle.style.color='#64748b';
      handle.onmouseleave=()=>handle.style.color='#2d3f5a';
      handle.addEventListener('mousedown',e=>{e.stopPropagation();row.draggable=true;});
      row.appendChild(handle);

      // Streak-Ring
      const s=h.streak||0;
      const pct=Math.min(s/Math.max(s,7),1);
      const streakDiv=document.createElement('div');
      streakDiv.style.cssText='display:flex;align-items:center;justify-content:center;padding:6px 0';
      streakDiv.innerHTML=`<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="10" fill="none" stroke="#1e293b" stroke-width="3"/><circle cx="13" cy="13" r="10" fill="none" stroke="${s>=7?'#f59e0b':s>=1?cat.color:'#243450'}" stroke-width="3" stroke-dasharray="${Math.round(pct*62.8)} 62.8" stroke-linecap="round" transform="rotate(-90 13 13)"/>${s>0?`<text x="13" y="17" text-anchor="middle" font-size="8" fill="#e2e8f0" font-weight="bold">${s}</text>`:`<text x="13" y="17" text-anchor="middle" font-size="8" fill="#334155">–</text>`}</svg>`;
      row.appendChild(streakDiv);

      // Name
      const nameDiv=document.createElement('div');
      nameDiv.style.cssText='display:flex;align-items:center;gap:6px;padding:6px 0 6px 4px;min-width:0';
      nameDiv.innerHTML=`<span style="font-size:15px;flex-shrink:0">${h.emoji}</span><span style="font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(h.name)}</span>`;
      row.appendChild(nameDiv);

      // Vergangene Dots (größer als vorher)
      for(let i=0;i<DAYS;i++){
        const done=h.done_dates?.includes(dateCols[i]);
        const dt=new Date(dateCols[i]);
        const isMon=['Mo'][0]===['So','Mo','Di','Mi','Do','Fr','Sa'][dt.getDay()];
        const dotDiv=document.createElement('div');
        dotDiv.style.cssText=`display:flex;align-items:center;justify-content:center;${isMon?'border-left:1px solid #1e293b':''}`;
        dotDiv.innerHTML=`<div title="${dateCols[i]}" style="width:${done?20:9}px;height:${done?20:9}px;border-radius:${done?5:10}px;background:${done?cat.color:'#1e293b'}"></div>`;
        row.appendChild(dotDiv);
      }

      // Heute-Checkbox
      const todayDone=h.done_dates?.includes(dateCols[DAYS]);
      const cb=document.createElement('div');
      cb.style.cssText='display:flex;align-items:center;justify-content:center';
      const cbBtn=document.createElement('button');
      cbBtn.style.cssText=`width:26px;height:26px;border-radius:7px;border:2px solid ${todayDone?cat.color:'#334155'};background:${todayDone?cat.color:'transparent'};cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;padding:0;transition:all .15s`;
      cbBtn.textContent=todayDone?'✓':'';
      let _done=todayDone;
      cbBtn.onclick=async(e)=>{
        e.stopPropagation();
        if(_done){
          await fetch('/api/habits/'+h.id+'/unlog',{method:'POST'});
          _done=false;
          cbBtn.textContent='';
          cbBtn.style.background='transparent';
          cbBtn.style.borderColor='#334155';
          toast('Zurückgesetzt');
        } else {
          await fetch('/api/habits/'+h.id+'/log',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
          _done=true;
          cbBtn.textContent='✓';
          cbBtn.style.background=cat.color;
          cbBtn.style.borderColor=cat.color;
          toast('🔥 Abgehakt');
        }
      };
      cb.appendChild(cbBtn);row.appendChild(cb);

      // X ganz rechts
      const delDiv=document.createElement('div');
      delDiv.style.cssText='display:flex;align-items:center;justify-content:center';
      const delBtn=document.createElement('button');
      delBtn.style.cssText='background:none;border:none;color:#2d3f5a;font-size:13px;cursor:pointer;padding:2px;border-radius:4px;line-height:1;transition:color .1s';
      delBtn.textContent='✕';
      delBtn.onmouseenter=()=>delBtn.style.color='#ef4444';
      delBtn.onmouseleave=()=>delBtn.style.color='#2d3f5a';
      delBtn.onclick=(e)=>{e.stopPropagation();deleteHabit(h.id,h.name);};
      delDiv.appendChild(delBtn);row.appendChild(delDiv);

      rows.appendChild(row);
    });
    section.appendChild(rows);
    masterCard.appendChild(section);
  });
  body.appendChild(masterCard);
};

// ════════ TASKS (Arten, Unteraufgaben, Fortschritt, Archiv) ════════
let taskFilter='open';
VIEWS.tasks=async(root)=>{
  const [ts, suggestions] = await Promise.all([
    api('/api/tasks?status='+taskFilter),
    api('/api/tasks/suggestions'),
  ]);

  root.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b style="font-size:18px">Aufgaben</b>
      <div style="display:flex;gap:8px">
        <button id="genBtn" onclick="generateTask()" class="soft" style="padding:8px 12px;font-size:13px;border:none;cursor:pointer" title="Alfred überlegt sich einen Vorschlag">💡 Generieren</button>
        <button class="btn" onclick="addTask()" style="padding:8px 14px;font-size:13px">＋ Neu</button>
      </div>
    </div>
    ${suggestions.length ? `
    <div style="margin-bottom:16px">
      <div style="font-size:12px;font-weight:700;color:#a5b4fc;letter-spacing:.5px;margin-bottom:8px">💡 ALFRED SCHLÄGT VOR</div>
      <div id="sugg-list"></div>
    </div>` : ''}
    <div class="tabbar">
      <div class="tab ${taskFilter==='open'?'active':''}" onclick="setTaskFilter('open')">Offen</div>
      <div class="tab" onclick="setTaskFilter('alfred')" style="${taskFilter==='alfred'?'border-bottom:2px solid #a5b4fc;color:#a5b4fc':''}">🤖 Alfred</div>
      <div class="tab ${taskFilter==='done'?'active':''}" onclick="setTaskFilter('done')">Erledigt</div>
      <div class="tab ${taskFilter==='archived'?'active':''}" onclick="setTaskFilter('archived')">Archiv</div>
    </div>
    <div id="tl"></div>`;

  // Suggestions rendern
  if(suggestions.length){
    const sl=$('#sugg-list');
    suggestions.forEach(s=>{
      const who=s.assigned_to==='alfred'?'<span style="font-size:10px;background:#1e3a5f;color:#a5b4fc;padding:2px 7px;border-radius:99px;margin-left:6px">Alfred erledigt</span>':'';
      const node=el(`<div class="card" style="padding:14px;margin-bottom:8px;border:1px solid #1e3a5f">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">${esc(s.title)}${who}</div>
        ${s.notes?`<div style="font-size:12px;color:#5b6b8c;margin-bottom:10px">${esc(s.notes)}</div>`:''}
        <div style="display:flex;gap:8px">
          <button onclick="acceptSuggestion(${s.id})" class="btn" style="flex:1;padding:8px;font-size:13px">✓ Annehmen</button>
          <button onclick="rejectSuggestion(${s.id},'${esc(s.title)}')" class="soft" style="flex:1;padding:8px;font-size:13px;border:none;cursor:pointer">✕ Ablehnen</button>
        </div>
      </div>`);
      sl.appendChild(node);
    });
  }

  // Tasks rendern
  const kindIcon={task:'',project:'📁 ',checklist:'☑️ '};
  let filtered=ts;
  if(taskFilter==='alfred') filtered=ts.filter(t=>t.assigned_to==='alfred');
  // "Offen" zeigt alle offenen Tasks — Alfred-Tasks mit blauem Rand erkennbar

  if(!filtered.length){
    $('#tl').innerHTML='<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">'+(taskFilter==='alfred'?'Keine Alfred-Aufgaben 🤖':'Nichts hier 🎉')+'</div>';
    return;
  }
  filtered.forEach(t=>{
    const subs=t.subtasks||[];
    const isAlfred=t.assigned_to==='alfred';
    const alfredChip=isAlfred?`<span style="font-size:10px;background:#1e3a5f;color:#a5b4fc;padding:2px 7px;border-radius:99px">🤖</span>`:'';
    const node=el(`<div class="card" style="padding:15px;margin-bottom:10px${isAlfred?';border-left:3px solid #3b5fc0':''}">
      <div style="display:flex;align-items:center;gap:11px">
        ${taskFilter==='open'?`<button onclick="completeTask(${t.id})" style="width:24px;height:24px;border-radius:7px;border:2px solid #3b5;background:none;cursor:pointer;flex-shrink:0"></button>`:''}
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600">${kindIcon[t.kind]||''}${esc(t.title)}${alfredChip}</div>
          ${subs.length?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${subs.filter(s=>s.status==='done').length}/${subs.length} erledigt · ${t.progress_pct}%</div><div class="pill-h" style="margin-top:5px"><div class="pill-f" style="width:${t.progress_pct}%"></div></div>`:''}
          ${t.alfred_result?`<div style="margin-top:8px;padding:8px;background:#0d1b2a;border-radius:8px;font-size:12px;color:#94a3b8;cursor:pointer" onclick="showResult(${t.id})">📄 Ergebnis ansehen</div>`:''}
        </div>
        <span>${({high:'🔴',medium:'🟡',low:'🟢'})[t.priority]||''}</span>
        <button onclick="taskMenu(${t.id},'${esc(t.title)}','${taskFilter}')" class="soft" style="border:none;border-radius:10px;padding:6px 9px;cursor:pointer">⋯</button>
      </div>
      ${subs.length?`<div style="margin-top:10px;padding-left:8px;border-left:2px solid var(--line)">${subs.map(s=>`<div style="display:flex;align-items:center;gap:9px;padding:4px 0"><button onclick="completeTask(${s.id})" style="width:18px;height:18px;border-radius:5px;border:2px solid #3b5;background:${s.status==='done'?'#22c55e':'none'};cursor:pointer"></button><span style="font-size:13px;${s.status==='done'?'text-decoration:line-through;color:#5b6b8c':''}">${esc(s.title)}</span></div>`).join('')}</div>`:''}
      ${(t.kind==='project'&&taskFilter==='open')?`<button onclick="addSubtask(${t.id})" class="soft" style="border:none;border-radius:10px;padding:6px 11px;font-size:12px;margin-top:8px;cursor:pointer">＋ Unteraufgabe</button>`:''}
    </div>`);
    $('#tl').appendChild(node);
  });
};

function setTaskFilter(f){taskFilter=f;go('tasks');}

async function acceptSuggestion(id){
  await post('/api/tasks/'+id+'/accept',{});
  toast('Aufgabe angenommen ✓');
  go('tasks');
}

function rejectSuggestion(id,title){
  formSheet('Vorschlag ablehnen',
    `<div style="font-size:14px;font-weight:600;margin-bottom:12px">"${title}"</div>
     <label style="font-size:12px;color:var(--muted)">Warum lehnst du ab? (hilft Alfred zu lernen)</label>
     <textarea id="rr" rows="3" placeholder="z.B. zu trivial, falsches Thema, bereits bekannt…" style="width:100%;box-sizing:border-box;margin-top:6px"></textarea>`,
    async()=>{
      await post('/api/tasks/'+id+'/reject',{reason:$('#rr').value});
      closeSheet(); toast('Abgelehnt'); go('tasks');
    }, 'Ablehnen'
  );
}

async function showResult(id){
  const ts=await api('/api/tasks?status=done');
  const t=ts.find(x=>x.id===id)||{};
  if(!t.alfred_result)return;
  sheet(`<div style="width:40px;height:4px;background:#33415a;border-radius:99px;margin:0 auto 16px"></div>
    <div style="font-weight:700;margin-bottom:12px">${esc(t.title)}</div>
    <div style="font-size:13px;line-height:1.6;color:#94a3b8;white-space:pre-wrap">${esc(t.alfred_result)}</div>`);
}

function taskMenu(id,title,filter){
  const opts=[];
  if(filter!=='archived')opts.push(`<button class="soft" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px" onclick="closeSheet();setProgress(${id},'${esc(title)}')">📊 Fortschritt setzen</button>`);
  if(filter==='open')opts.push(`<button class="soft" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;margin-bottom:8px" onclick="closeSheet();archiveTask(${id})">📦 Archivieren</button>`);
  opts.push(`<button class="soft" style="border:none;padding:13px;border-radius:12px;width:100%;text-align:left;cursor:pointer;color:#ef6b6b" onclick="closeSheet();deleteTask(${id},'${esc(title)}')">🗑 Löschen</button>`);
  sheet(`<div style="width:40px;height:4px;background:#33415a;border-radius:99px;margin:0 auto 16px"></div><div style="font-weight:700;margin-bottom:14px">${esc(title)}</div>${opts.join('')}`);
}

// ════════ CALENDAR ════════
VIEWS.calendar=async(root)=>{
  root.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:18px">📅 Kalender</b><button class="btn" onclick="addEvent()" style="padding:8px 14px;font-size:13px">＋ Termin</button></div><div id="cl"></div>';
  const es=await api('/api/calendar?days=30');
  const cl=document.getElementById('cl');
  if(!es.length){cl.innerHTML='<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">Keine Termine in den nächsten 30 Tagen.</div>';return;}
  // Gruppieren nach Datum
  const groups={};
  es.forEach(e=>{
    const d=e.start?e.start.split(' ')[0]||e.start.split('T')[0]:'?';
    (groups[d]||(groups[d]=[])).push(e);
  });
  Object.entries(groups).forEach(([d,evs])=>{
    const hdr=document.createElement('div');
    hdr.style.cssText='font-size:12px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px';
    hdr.textContent=d;
    cl.appendChild(hdr);
    evs.forEach(e=>{
      const card=document.createElement('div');
      card.className='card';
      card.style.cssText='padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center';
      const timeDiv=document.createElement('div');
      timeDiv.style.cssText='min-width:48px;text-align:center;font-size:12px;color:#a5b4fc;font-weight:600';
      timeDiv.textContent=e.start&&e.start.includes(' ')?e.start.split(' ')[1]:'📅';
      const body=document.createElement('div');
      body.style.cssText='flex:1;min-width:0';
      const title=document.createElement('div');
      title.style.cssText='font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
      title.textContent=e.title;
      body.appendChild(title);
      if(e.location){const loc=document.createElement('div');loc.style.cssText='font-size:12px;color:var(--muted)';loc.textContent='📍 '+e.location;body.appendChild(loc);}
      const right=document.createElement('div');
      right.style.cssText='display:flex;gap:6px;align-items:center;flex-shrink:0';
      if(e.calendar){const chip=document.createElement('span');chip.className='chip';chip.textContent=e.calendar;right.appendChild(chip);}
      // Edit/Delete nur für Alfred-eigene Termine
      if(e.source==='alfred'&&e.uid){
        const editBtn=document.createElement('button');
        editBtn.className='btn';editBtn.style.cssText='padding:4px 8px;font-size:11px';editBtn.textContent='✏️';
        editBtn.onclick=()=>editEvent(e);
        const delBtn=document.createElement('button');
        delBtn.style.cssText='background:#dc2626;color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer';delBtn.textContent='🗑';
        delBtn.onclick=()=>askDelEvent(e);
        right.appendChild(editBtn);right.appendChild(delBtn);
      }
      card.appendChild(timeDiv);card.appendChild(body);card.appendChild(right);
      cl.appendChild(card);
    });
  });
};

async function askDelEvent(e){
  if(!confirm('Termin "'+e.title+'" löschen?'))return;
  await fetch('/api/calendar/'+e.uid,{method:'DELETE'});
  toast('Gelöscht ✓');go('calendar');
}

function editEvent(e){
  // Datum für datetime-local formatieren
  const toLocal=s=>{if(!s)return '';const d=new Date(s);if(isNaN(d))return s;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
  const wrap=document.createElement('div');
  const f1=document.createElement('input');f1.placeholder='Titel';f1.value=e.title||'';
  const f2=document.createElement('input');f2.type='datetime-local';f2.value=toLocal(e.start_iso||e.start)||'';
  const f3=document.createElement('input');f3.type='datetime-local';f3.value=toLocal(e.end_iso||e.end)||'';
  const f4=document.createElement('input');f4.placeholder='Ort (optional)';f4.value=e.location||'';
  [f1,f2,f3,f4].forEach(f=>{f.style.cssText='display:block;width:100%;margin-bottom:10px;padding:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#fff;font-size:14px';wrap.appendChild(f);});
  formSheet('Termin bearbeiten',wrap.innerHTML,async()=>{
    const inputs=document.querySelectorAll('#sheetBody input');
    await fetch('/api/calendar/'+e.uid,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:inputs[0].value,start:inputs[1].value,end:inputs[2].value||null,location:inputs[3].value||null})});
    closeSheet();toast('Gespeichert ✓');go('calendar');
  });
}

};

// ════════ JOURNAL ════════
VIEWS.journal=async(root)=>{
  const emo=['','😞','😕','😐','🙂','😄'];
  const moodCol=['','#ef4444','#f97316','#eab308','#22c55e','#10b981'];

  // Parallele Requests
  const [todayEntry, moodData, history] = await Promise.all([
    api('/api/journal/today'),
    api('/api/journal/mood?days=21'),
    api('/api/journal?limit=20'),
  ]);
  const hasToday = todayEntry && todayEntry.id;

  root.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <b style="font-size:18px">Journal</b>
      ${hasToday?`<button class="soft" onclick="journalCheckin()" style="padding:7px 13px;font-size:12px">✏️ Bearbeiten</button>`:''}
    </div>

    ${hasToday ? `
    <div class="card" style="padding:16px;margin-bottom:14px;border:1px solid #1e3a5f">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:13px;color:var(--muted)">Heute eingetragen ✓</span>
        <span style="font-size:22px">${emo[todayEntry.mood||3]}</span>
      </div>
      <div style="display:flex;gap:16px;font-size:13px">
        <span>Stimmung&nbsp;<b style="color:${moodCol[todayEntry.mood||3]}">${todayEntry.mood||'–'}/5</b></span>
        <span>Energie&nbsp;<b style="color:#f59e0b">${todayEntry.energy||'–'}/5</b></span>
      </div>
      ${todayEntry.content ? `<div style="margin-top:10px;font-size:13px;color:#94a3b8;line-height:1.5">${esc(todayEntry.content).slice(0,120)}${todayEntry.content.length>120?'…':''}</div>` : ''}
    </div>
    ` : `
    <div class="card" style="padding:20px;margin-bottom:14px;text-align:center;background:linear-gradient(135deg,#0f1c2e,#1a2a3a);border:1px dashed #2a4a6a">
      <div style="font-size:32px;margin-bottom:8px">📖</div>
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">Abend-Check-in</div>
      <div style="font-size:13px;color:#5b6b8c;margin-bottom:14px">Wie war dein Tag? Alfred hat 3 Fragen für dich.</div>
      <button class="btn" onclick="journalCheckin()" style="padding:10px 24px;font-size:14px">Jetzt eintragen</button>
    </div>
    `}

    <div class="card" style="padding:16px;margin-bottom:14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px;color:#94a3b8">Stimmung & Energie — 3 Wochen</div>
      <div style="position:relative;height:110px"><canvas id="cMood"></canvas></div>
    </div>

    <div style="font-size:13px;font-weight:600;color:#5b6b8c;margin-bottom:8px;padding-left:2px">Vergangene Einträge</div>
    <div id="jl"></div>`;

  lineChart('cMood', moodData.map(x=>x.date?.slice(5)), [
    {label:'Stimmung', data:moodData.map(x=>x.mood), color:'#22c55e'},
    {label:'Energie',  data:moodData.map(x=>x.energy), color:'#f59e0b'},
  ]);

  const filtered = history.filter(j => !hasToday || j.id !== todayEntry.id);
  $('#jl').innerHTML = filtered.length ? filtered.map(j => {
    let details = '';
    if (j.prompts_answers) {
      const qa = typeof j.prompts_answers === 'string' ? JSON.parse(j.prompts_answers) : j.prompts_answers;
      details = qa.filter(x=>x.answer).map(x=>`<div style="margin-top:8px"><div style="font-size:11px;color:#5b6b8c">${esc(x.question)}</div><div style="font-size:13px;margin-top:2px">${esc(x.answer)}</div></div>`).join('');
    }
    if (j.content) details += `<div style="margin-top:8px;font-size:13px;color:#94a3b8;font-style:italic">${esc(j.content)}</div>`;
    return `<div class="card" style="padding:14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
        <span>${new Date(j.date+'T12:00:00').toLocaleDateString('de',{weekday:'short',day:'numeric',month:'short'})}</span>
        <span>${j.mood?emo[j.mood]+' '+j.mood:''} ${j.energy?'⚡'+j.energy:''}</span>
      </div>
      ${details||'<div style="font-size:13px;color:#5b6b8c;margin-top:6px">–</div>'}
    </div>`;
  }).join('') : '<div style="padding:20px;text-align:center;color:#5b6b8c;font-size:13px">Noch keine früheren Einträge.</div>';
};

async function journalCheckin(){
  // Prompts laden (async, Spinner zeigen)
  const sheet = document.createElement('div');
  sheet.id = 'jsheet';
  sheet.style.cssText = 'position:fixed;inset:0;background:#0a0f1a;z-index:200;overflow-y:auto;padding:20px 16px 40px';
  sheet.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button onclick="document.getElementById('jsheet').remove()" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer">←</button>
      <b style="font-size:17px">Abend-Check-in</b>
    </div>
    <div style="text-align:center;padding:40px 0;color:#5b6b8c" id="jloading">
      <div style="font-size:24px;margin-bottom:8px">🤔</div>
      Alfred überlegt sich Fragen…
    </div>`;
  document.body.appendChild(sheet);

  const emo = ['','😞','😕','😐','🙂','😄'];
  const moodCol = ['','#ef4444','#f97316','#eab308','#22c55e','#10b981'];
  let selMood = 3, selEnergy = 3;

  let prompts;
  try { prompts = (await api('/api/journal/prompts')).prompts; }
  catch(e) { prompts = ['Wie war dein Tag?','Was hat dich beschäftigt?','Worauf bist du stolz?']; }

  const moodBtns = [1,2,3,4,5].map(v =>
    `<button onclick="selMood=${v};document.querySelectorAll('.mbtn').forEach((b,i)=>{b.style.background=i+1==${v}?'${moodCol[v]}':'transparent';b.style.transform=i+1==${v}?'scale(1.25)':'scale(1)'});this.style.background='${moodCol[v]}'" class="mbtn" style="font-size:26px;background:transparent;border:none;cursor:pointer;transition:all .15s">${emo[v]}</button>`
  ).join('');
  const energyBtns = [1,2,3,4,5].map(v =>
    `<button onclick="selEnergy=${v};document.querySelectorAll('.ebtn').forEach((b,i)=>{b.style.background=i+1==${v}?'#f59e0b22':'transparent';b.style.transform=i+1==${v}?'scale(1.25)':'scale(1)';b.style.color=i+1<=${v}?'#f59e0b':'#334155'});" class="ebtn" style="font-size:20px;background:transparent;border:none;cursor:pointer;transition:all .15s;color:#334155">⚡</button>`
  ).join('');

  const questionsHtml = prompts.map((q,i) => `
    <div style="margin-bottom:18px">
      <div style="font-size:13px;color:#a5b4fc;margin-bottom:6px;font-weight:600">${esc(q)}</div>
      <textarea id="ja${i}" rows="2" placeholder="Deine Antwort…" style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:10px;font-size:13px;resize:vertical;font-family:inherit"></textarea>
    </div>`).join('');

  document.getElementById('jloading').outerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:12px">Wie war deine Stimmung?</div>
      <div style="display:flex;justify-content:space-around;padding:8px 0">${moodBtns}</div>
    </div>
    <div style="margin-bottom:24px">
      <div style="font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:12px">Energielevel?</div>
      <div style="display:flex;justify-content:space-around;padding:8px 0">${energyBtns}</div>
    </div>
    <div style="border-top:1px solid #1a2a3a;padding-top:20px;margin-bottom:4px">
      <div style="font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:16px">💬 Alfred fragt…</div>
      ${questionsHtml}
    </div>
    <div style="margin-bottom:24px">
      <div style="font-size:13px;color:#94a3b8;font-weight:600;margin-bottom:6px">Freier Gedanke</div>
      <textarea id="jfree" rows="4" placeholder="Alles was dir noch durch den Kopf geht…" style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:10px;font-size:13px;resize:vertical;font-family:inherit"></textarea>
    </div>
    <button onclick="submitJournal(${prompts.length})" class="btn" style="width:100%;padding:14px;font-size:15px;font-weight:600">Speichern ✓</button>`;

  // Default-Highlight Mood=3
  const mBtns = document.querySelectorAll('.mbtn');
  mBtns[2].style.transform='scale(1.25)'; mBtns[2].style.background=moodCol[3];
  const eBtns = document.querySelectorAll('.ebtn');
  [0,1,2].forEach(i=>{eBtns[i].style.color='#f59e0b';});
}

async function submitJournal(nq){
  const answers = [];
  // Prompts aus den Labels lesen
  const labels = document.querySelectorAll('#jsheet [style*="a5b4fc"]');
  for(let i=0;i<nq;i++){
    const q = labels[i]?.textContent || '';
    const a = document.getElementById('ja'+i)?.value||'';
    answers.push({question:q, answer:a});
  }
  const free = document.getElementById('jfree')?.value||'';
  const btn = document.querySelector('#jsheet .btn');
  if(btn){btn.disabled=true;btn.textContent='Wird gespeichert…';}
  await post('/api/journal',{mood:selMood,energy:selEnergy,content:free,prompts_answers:answers.filter(x=>x.answer)});
  document.getElementById('jsheet')?.remove();
  toast('Journal gespeichert 📖');
  if(CUR==='journal') go(CUR);
}

VIEWS.goals=async(root)=>{
  root.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:18px">Ziele</b><button class="btn" onclick="addGoal()" style="padding:8px 14px;font-size:13px">＋ Ziel</button></div><div id="gl"></div>`;
  const gs=await api('/api/goals');
  if(!gs.length){$('#gl').innerHTML='<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">Noch keine Ziele.</div>';return;}
  const ic={fitness:'💪',career:'💼',finance:'💰',personal:'🌱',general:'🎯'};
  gs.forEach(g=>$('#gl').appendChild(el(`<div class="card" style="padding:16px;margin-bottom:12px;cursor:pointer" onclick="updateGoal(${g.id},'${esc(g.title)}')"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px"><span>${ic[g.category]||'🎯'}</span><b>${esc(g.title)}</b></div><span style="color:#a5b4fc">${g.progress_pct}%</span></div>${g.target_value?`<div style="font-size:12px;color:var(--muted);margin-top:4px">${g.current_value||0} / ${g.target_value} ${g.unit||''}</div>`:''}<div class="pill-h" style="margin-top:10px"><div class="pill-f" style="width:${g.progress_pct}%"></div></div></div>`)));
};

// ════════ MEMORY (delete confirm) ════════
VIEWS.memory=async(root)=>{
  root.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <b style="font-size:18px">Gedächtnis</b>
      <button class="btn" onclick="addMemory()" style="padding:8px 14px;font-size:13px">＋ Merken</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="soft mem-tab active" data-tab="lzg" onclick="memTab('lzg',this)" style="flex:1;padding:9px;font-size:13px">🧠 Fakten (${0})</button>
      <button class="soft mem-tab" data-tab="kg" onclick="memTab('kg',this)" style="flex:1;padding:9px;font-size:13px">🕸️ Wissens-Graph</button>
    </div>
    <div id="mem-lzg"></div>
    <div id="mem-kg" style="display:none"></div>`;

  const col={fact:'#60a5fa',goal:'#4ade80',pattern:'#c084fc',preference:'#f472b6',correction:'#fb923c',context:'#67e8f9',identity:'#fbbf24'};
  const typeCol={person:'#c084fc',place:'#34d399',project:'#60a5fa',organization:'#f472b6',concept:'#fb923c',habit:'#4ade80',goal:'#fbbf24'};

  const [ms, kg] = await Promise.all([api('/api/memories'), api('/api/knowledge')]);

  // Tab-Titel aktualisieren
  root.querySelector('[data-tab="lzg"]').textContent=`🧠 Fakten (${ms.length})`;
  root.querySelector('[data-tab="kg"]').textContent=`🕸️ Graph (${(kg.entities||[]).length} / ${(kg.relations||[]).length})`;

  // LZG-Fakten
  $('#mem-lzg').innerHTML=ms.length?ms.map(m=>`
    <div class="card" style="padding:13px;margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span class="chip" style="color:${col[m.category]||'#9fb0d6'}">${m.category}</span>
        <div style="display:flex;gap:10px;align-items:center">
          <span style="font-size:11px;color:var(--muted)">${Math.round(m.confidence*100)}%</span>
          <button onclick="askDelMemory(${m.id})" style="background:none;border:none;color:#ef6b6b;font-size:15px;cursor:pointer">✕</button>
        </div>
      </div>
      <div style="font-size:14px">${esc(m.content)}</div>
    </div>`).join(''):'<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">Noch keine Erinnerungen.</div>';

  // KG-Viewer – ohne verschachtelte Template-Literals
  const ents=kg.entities||[], rels=kg.relations||[];
  const relsBySubj={};
  rels.forEach(r=>{(relsBySubj[r.subject]=relsBySubj[r.subject]||[]).push(r);});

  if(!ents.length){
    $('#mem-kg').innerHTML='<div class="card" style="padding:24px;text-align:center;color:#5b6b8c">Noch kein Wissens-Graph.</div>';
  } else {
    const kgEl=$('#mem-kg');
    kgEl.innerHTML='';
    ents.forEach(e=>{
      const card=document.createElement('div');
      card.className='card';
      card.style.cssText='padding:12px;margin-bottom:8px';

      // Header
      const hdr=document.createElement('div');
      hdr.style.cssText='display:flex;justify-content:space-between;align-items:center';
      const nameSpan=document.createElement('div');
      nameSpan.innerHTML=`<span style="font-weight:600;font-size:14px">${esc(e.name)}</span> `
        +`<span class="chip" style="color:${typeCol[e.type]||'#9fb0d6'}">${e.type}</span>`;
      const delBtn=document.createElement('button');
      delBtn.textContent='✕'; delBtn.style.cssText='background:none;border:none;color:#ef6b6b;font-size:14px;cursor:pointer';
      delBtn.onclick=()=>askDelKgEntity(e.id);
      hdr.appendChild(nameSpan); hdr.appendChild(delBtn);
      card.appendChild(hdr);

      // Beschreibung
      if(e.description){
        const desc=document.createElement('div');
        desc.style.cssText='font-size:12px;color:var(--muted);margin-top:4px';
        desc.textContent=e.description;
        card.appendChild(desc);
      }

      // Relationen
      (relsBySubj[e.name]||[]).forEach(r=>{
        const row=document.createElement('div');
        row.style.cssText='font-size:12px;color:#a5b4fc;margin-top:6px;display:flex;justify-content:space-between;align-items:center';
        const txt=document.createElement('span');
        txt.innerHTML='→ <b>'+r.predicate.replace(/_/g,' ')+'</b> → '+esc(r.object);
        const rDel=document.createElement('button');
        rDel.textContent='✕'; rDel.style.cssText='background:none;border:none;color:#4a5980;font-size:12px;cursor:pointer';
        rDel.onclick=()=>askDelKgRelation(r.id);
        row.appendChild(txt); row.appendChild(rDel);
        card.appendChild(row);
      });

      kgEl.appendChild(card);
    });
  }
};
function memTab(tab,btn){
  document.querySelectorAll('.mem-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  $('#mem-lzg').style.display=tab==='lzg'?'':'none';
  $('#mem-kg').style.display=tab==='kg'?'':'none';
}
function askDelMemory(id){confirmAction('Diese Erinnerung wirklich löschen?',async()=>{await del('/api/memories/'+id);toast('Gelöscht');go('memory');});}
function askDelKgEntity(id){confirmAction('Entität und alle ihre Relationen löschen?',async()=>{await del('/api/knowledge/entity/'+id);toast('Gelöscht');go('memory');});}
function askDelKgRelation(id){confirmAction('Relation löschen?',async()=>{await del('/api/knowledge/relation/'+id);toast('Gelöscht');go('memory');});}

// ════════ MIND ════════
VIEWS.mind=async(root)=>{
  root.innerHTML=`<b style="font-size:18px">Alfred Mind 🌌</b>

    <!-- Live-Status ganz oben -->
    <div id="mindStatusBar" class="status-bar idle" style="margin-top:14px">
      <span class="sdot idle"></span>
      <span class="stxt" style="flex:1">💭 Bereit</span>
      <span style="font-size:11px;color:#4a5980" id="mindModel">–</span>
    </div>

    <!-- Aktivitäts-Stream -->
    <div class="card" style="padding:16px;margin-top:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <b>⚡ Aktivität</b>
        <span id="mindActCount" class="chip">0 Events</span>
      </div>
      <div id="actFeed" style="max-height:320px;overflow-y:auto"></div>
    </div>

    <div class="grid2">
      <div class="card" style="padding:16px;margin-top:12px"><b>Gelernt über dich</b><div id="mNotes" style="margin-top:8px"></div></div>
      <div class="card" style="padding:16px;margin-top:12px"><b>Reflexionen</b><div id="mRef" style="margin-top:8px"></div></div>
    </div>
    <div class="card" style="padding:16px;margin-top:12px"><b>Event-Log</b><div id="mFeed" style="margin-top:8px;max-height:280px;overflow-y:auto"></div></div>`;

  // Aktueller Status initial
  const cur=await api('/api/status/current').catch(()=>({type:'idle',text:'Bereit'}));
  const msb=$('#mindStatusBar');
  if(msb){msb.className=`status-bar ${cur.type||'idle'}`;msb.querySelector('.sdot').className=`sdot ${cur.type||'idle'}`;msb.querySelector('.stxt').textContent=`${STATUS_ICONS[cur.type||'idle']||'·'} ${cur.text||'Bereit'}`;}
  const mm=$('#mindModel');if(mm&&cur.detail)mm.textContent=cur.detail;

  // Buffered activity log reinspielen
  const actFeed=$('#actFeed');
  _actLog.slice(0,40).forEach(evt=>{
    const row=el(`<div class="act-row"><span>${STATUS_ICONS[evt.type]||'·'}</span><span style="flex:1;color:#c7d2fe">${esc(evt.text||'')}${evt.detail?` <span style="color:var(--muted)">${esc(evt.detail)}</span>`:''}</span><span style="color:#4a5980">${new Date(evt.ts*1000).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}</span></div>`);
    actFeed.appendChild(row);
  });
  if(!_actLog.length) actFeed.innerHTML='<span style="color:#5b6b8c;font-size:13px">Warte auf Aktivität…</span>';
  const mc=$('#mindActCount');if(mc)mc.textContent=`${_actLog.length} Events`;

  // Mind-StatusBar mit globalem Stream verknüpfen (überschreibt applyStatus-Side-Effect)
  const _origApply=applyStatus;
  const _mindPatch=(evt)=>{
    _origApply(evt);
    if(CUR!=='mind') return;
    if(mc)mc.textContent=`${_actLog.length} Events`;
    if(msb&&evt.type&&!evt.keepalive){
      msb.className=`status-bar ${evt.type}`;
      const sd=msb.querySelector('.sdot');if(sd)sd.className=`sdot ${evt.type}`;
      const st=msb.querySelector('.stxt');if(st)st.textContent=`${STATUS_ICONS[evt.type]||'·'} ${evt.text||''}`;
      const mmEl=$('#mindModel');if(mmEl&&evt.detail)mmEl.textContent=evt.detail;
    }
  };
  // Temporär überschreiben während mind aktiv
  window.applyStatus=_mindPatch;
  root._cleanup=()=>{window.applyStatus=_origApply;};

  const m=await api('/api/mind');
  $('#mNotes').innerHTML=(m.notes||[]).length?m.notes.map(n=>`<div style="font-size:13px;color:#c7d2fe;padding:4px 0">• ${esc(n)}</div>`).join(''):'<span style="color:#5b6b8c;font-size:13px">Lernt noch…</span>';
  $('#mRef').innerHTML=(m.reflections||[]).length?m.reflections.map(r=>`<div style="font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">🪞 ${esc(r.content)}</div>`).join(''):'<span style="color:#5b6b8c;font-size:13px">Noch keine.</span>';
  const feed=$('#mFeed');feed.innerHTML=(m.events||[]).map(e=>`<div style="display:flex;gap:8px;padding:4px 0;font-size:12px;color:#9fb0d6"><span>${feedIcon(e.type)}</span><span style="flex:1">${esc(e.summary)}</span></div>`).join('');
  try{const es=new EventSource(`${API}/api/feed/stream`);es.onmessage=ev=>{if(CUR!=='mind'){es.close();return;}const e=JSON.parse(ev.data);feed.prepend(el(`<div style="display:flex;gap:8px;padding:4px 0;font-size:12px;color:#9fb0d6"><span>${feedIcon(e.type)}</span><span style="flex:1">${esc(e.summary)}</span></div>`));};}catch(e){}
};

// ════════ ANALYTICS ════════
VIEWS.analytics=async(root)=>{
  root.innerHTML=`<b style="font-size:18px">Analytics 📊</b>
    <div class="grid2">
      <div class="card" style="padding:16px;margin-top:12px"><b>Schlaf & HRV (30T)</b><div style="position:relative;height:150px;margin-top:8px"><canvas id="aHealth"></canvas></div></div>
      <div class="card" style="padding:16px;margin-top:12px"><b>Schritte (30T)</b><div style="position:relative;height:150px;margin-top:8px"><canvas id="aSteps"></canvas></div></div>
    </div>
    <div class="card" style="padding:16px;margin-top:12px"><b>Gewohnheiten-Konsistenz (30T)</b><div id="aHabits" style="margin-top:8px"></div></div>`;
  const a=await api('/api/analytics');const h=[...(a.health||[])].reverse();
  lineChart('aHealth',h.map(x=>x.date?.slice(5)),[{label:'Schlaf',data:h.map(x=>x.sleep),color:'#8b5cf6'},{label:'HRV',data:h.map(x=>x.hrv),color:'#22c55e',y1:true}]);
  barChart('aSteps',h.map(x=>x.date?.slice(5)),h.map(x=>x.steps));
  $('#aHabits').innerHTML=(a.habits||[]).map(x=>`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${x.emoji} ${esc(x.name)}</span><span style="color:#a5b4fc">${x.done_count}/30</span></div><div class="pill-h" style="margin-top:4px"><div class="pill-f" style="width:${Math.round(x.done_count/30*100)}%"></div></div></div>`).join('')||'<span style="color:#5b6b8c;font-size:13px">Keine Daten.</span>';
};
