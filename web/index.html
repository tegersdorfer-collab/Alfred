// ════════ Charts ════════
function lineChart(id,labels,series){const ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(ctx,{type:'line',data:{labels,datasets:series.map(s=>({label:s.label,data:s.data,borderColor:s.color,backgroundColor:s.color+'22',tension:.4,fill:true,pointRadius:0,borderWidth:2,yAxisID:s.y1?'y1':'y'}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9fb0d6',boxWidth:10,font:{size:10}}}},scales:{x:{ticks:{color:'#5b6b8c',font:{size:9},maxTicksLimit:7},grid:{display:false}},y:{ticks:{color:'#5b6b8c',font:{size:9}},grid:{color:'#16203a'}},y1:series.some(s=>s.y1)?{position:'right',ticks:{color:'#5b6b8c',font:{size:9}},grid:{display:false}}:{display:false}}}});}
function barChart(id,labels,data){const ctx=document.getElementById(id);if(!ctx)return;if(charts[id])charts[id].destroy();charts[id]=new Chart(ctx,{type:'bar',data:{labels,datasets:[{data,backgroundColor:'#3b82f6aa',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#5b6b8c',font:{size:9},maxTicksLimit:8},grid:{display:false}},y:{ticks:{color:'#5b6b8c',font:{size:9}},grid:{color:'#16203a'}}}}});}

// ════════ Forms ════════
function formSheet(title,fields,onsave){sheet(`<div style="width:40px;height:4px;background:#33415a;border-radius:99px;margin:0 auto 16px"></div><div style="font-weight:700;font-size:18px;margin-bottom:14px">${title}</div><div style="display:flex;flex-direction:column;gap:10px">${fields}</div><button class="btn" id="fsave" style="width:100%;margin-top:16px">Speichern</button>`);$('#fsave').onclick=onsave;}
function addTask(){
  const sheet=document.createElement('div');
  sheet.id='tasksheet';
  sheet.style.cssText='position:fixed;inset:0;background:#0a0f1a;z-index:200;overflow-y:auto;padding:20px 16px 40px';
  sheet.innerHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px">
      <button onclick="document.getElementById('tasksheet').remove()" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer">←</button>
      <b style="font-size:17px">Neue Aufgabe</b>
    </div>

    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:6px">Titel *</label>
      <input id="tt" placeholder="Was soll erledigt werden?" style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:12px;font-size:15px;font-family:inherit">
    </div>

    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:6px">Details / Kontext</label>
      <textarea id="tn" rows="3" placeholder="Hintergründe, Links, was Alfred wissen sollte…" style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:12px;font-size:13px;resize:vertical;font-family:inherit"></textarea>
    </div>

    <div style="margin-bottom:16px">
      <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:8px">Wer erledigt das?</label>
      <div style="display:flex;gap:8px">
        <button id="assignMe" onclick="setAssignee('user')" style="flex:1;padding:12px;border-radius:10px;border:2px solid #22c55e;background:#0d2a1a;color:#22c55e;cursor:pointer;font-size:13px;font-weight:600">👤 Ich</button>
        <button id="assignAlfred" onclick="setAssignee('alfred')" style="flex:1;padding:12px;border-radius:10px;border:1px solid #1e3a5f;background:transparent;color:#5b6b8c;cursor:pointer;font-size:13px;font-weight:600">🤖 Alfred</button>
        <button id="assignAuto" onclick="setAssignee('auto')" style="flex:1;padding:12px;border-radius:10px;border:1px solid #1e3a5f;background:transparent;color:#5b6b8c;cursor:pointer;font-size:13px;font-weight:600">✨ Auto</button>
      </div>
      <div id="alfrednote" style="display:none;margin-top:8px;font-size:12px;color:#a5b4fc;background:#0d1525;padding:8px 12px;border-radius:8px">
        🤖 Alfred übernimmt diese Aufgabe selbstständig und erarbeitet ein Ergebnis.
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-bottom:16px">
      <div style="flex:1">
        <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:6px">Typ</label>
        <select id="tk" style="width:100%;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:10px;font-size:13px">
          <option value="task">Aufgabe</option>
          <option value="project">Projekt</option>
          <option value="checklist">Checkliste</option>
        </select>
      </div>
      <div style="flex:1">
        <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:6px">Priorität</label>
        <select id="tp" style="width:100%;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:10px;font-size:13px">
          <option value="medium">🟡 Mittel</option>
          <option value="high">🔴 Hoch</option>
          <option value="low">🟢 Niedrig</option>
        </select>
      </div>
    </div>

    <div style="margin-bottom:24px">
      <label style="font-size:12px;color:#5b6b8c;display:block;margin-bottom:6px">Fällig (optional)</label>
      <input id="td" placeholder="z.B. morgen 9:00 oder 20.06.2026" style="width:100%;box-sizing:border-box;background:#0d1b2a;border:1px solid #1e3a5f;border-radius:10px;color:#e2e8f0;padding:12px;font-size:13px;font-family:inherit">
    </div>

    <button onclick="submitTask()" class="btn" style="width:100%;padding:14px;font-size:15px;font-weight:600">Erstellen</button>`;
  document.body.appendChild(sheet);
  window._taskAssignee = 'user';
  setTimeout(()=>document.getElementById('tt')?.focus(),100);
}

function setAssignee(who){
  window._taskAssignee = who;
  ['user','alfred','auto'].forEach(k=>{
    const btn=document.getElementById('assign'+k.charAt(0).toUpperCase()+k.slice(1));
    if(!btn)return;
    if(k===who){
      btn.style.border='2px solid '+(who==='alfred'?'#a5b4fc':who==='auto'?'#f59e0b':'#22c55e');
      btn.style.background=who==='alfred'?'#0d1525':who==='auto'?'#1a1400':'#0d2a1a';
      btn.style.color=who==='alfred'?'#a5b4fc':who==='auto'?'#f59e0b':'#22c55e';
    } else {
      btn.style.border='1px solid #1e3a5f';
      btn.style.background='transparent';
      btn.style.color='#5b6b8c';
    }
  });
  document.getElementById('alfrednote').style.display=who==='alfred'?'block':'none';
}

async function submitTask(){
  const title=document.getElementById('tt')?.value?.trim();
  if(!title){document.getElementById('tt').style.borderColor='#ef4444';return;}
  const btn=document.querySelector('#tasksheet .btn');
  if(btn){btn.disabled=true;btn.textContent='Wird erstellt…';}
  const assignee=window._taskAssignee||'user';
  const payload={
    title,
    notes:document.getElementById('tn')?.value||'',
    kind:document.getElementById('tk')?.value||'task',
    priority:document.getElementById('tp')?.value||'medium',
    due:document.getElementById('td')?.value||'',
    assigned_to: assignee==='auto'?undefined:assignee,
  };
  await post('/api/tasks',payload);
  document.getElementById('tasksheet')?.remove();
  toast(assignee==='alfred'?'Alfred übernimmt 🤖':'Aufgabe erstellt ✓');
  if(CUR==='tasks'||CUR==='home')go(CUR);
}

async function generateTask(){
  const btn=document.getElementById('genBtn');
  if(btn){btn.disabled=true;btn.textContent='⏳ Überlegt…';}
  await post('/api/tasks/generate',{});
  setTimeout(()=>{
    if(btn){btn.disabled=false;btn.textContent='💡 Generieren';}
    toast('Alfred überlegt sich einen Vorschlag…');
    setTimeout(()=>go('tasks'),3000);
  },1000);
}
function addSubtask(pid){formSheet('Unteraufgabe',`<input id="f1" placeholder="Titel">`,async()=>{await post('/api/tasks',{title:$('#f1').value,parent_id:pid});closeSheet();toast('Hinzugefügt ✓');go('tasks');});}
function addEvent(){
  const now=new Date();const pad=n=>String(n).padStart(2,'0');
  const def=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'T'+pad(now.getHours()+1)+':00';
  formSheet('Neuer Termin',`<input id="f1" placeholder="Titel" style="display:block;width:100%;margin-bottom:10px;padding:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#fff;font-size:14px"><label style="font-size:12px;color:#64748b">Start</label><input id="f2" type="datetime-local" value="${def}" style="display:block;width:100%;margin-bottom:10px;padding:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#fff;font-size:14px"><label style="font-size:12px;color:#64748b">Ende (optional)</label><input id="f3" type="datetime-local" style="display:block;width:100%;margin-bottom:10px;padding:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#fff;font-size:14px"><input id="f4" placeholder="Ort (optional)" style="display:block;width:100%;padding:8px;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#fff;font-size:14px">`,
  async()=>{
    const t=$('#f1').value,s=$('#f2').value,e=$('#f3').value,l=$('#f4').value;
    if(!t||!s){toast('Titel und Start erforderlich');return;}
    await post('/api/calendar',{title:t,start:s,end:e||null,location:l||null});
    closeSheet();toast('Erstellt ✓');if(CUR==='calendar')go(CUR);
  });
}
function addMeal(){formSheet('Mahlzeit',`<input id="f1" placeholder="Beschreibung"><select id="f2"><option value="breakfast">Frühstück</option><option value="lunch">Mittag</option><option value="dinner">Abend</option><option value="snack">Snack</option></select><div style="display:flex;gap:8px"><input id="f3" type="number" placeholder="kcal"><input id="f4" type="number" placeholder="Protein g"></div><div style="display:flex;gap:8px"><input id="f5" type="number" placeholder="Carbs g"><input id="f6" type="number" placeholder="Fett g"></div>`,async()=>{await post('/api/nutrition',{description:$('#f1').value,meal_type:$('#f2').value,calories:+$('#f3').value||null,protein_g:+$('#f4').value||null,carbs_g:+$('#f5').value||null,fat_g:+$('#f6').value||null});closeSheet();toast('Erfasst ✓');if(CUR==='nutrition'||CUR==='home')go(CUR);});}
function addWorkout(){formSheet('Training (manuell)',`<input id="f1" placeholder="Titel"><select id="f2"><option value="strength">Kraft</option><option value="run">Lauf</option><option value="mobility">Mobility</option><option value="other">Andere</option></select><div style="display:flex;gap:8px"><input id="f3" type="number" placeholder="Dauer min"><input id="f4" type="number" step="0.1" placeholder="km"></div>`,async()=>{await post('/api/workouts',{title:$('#f1').value,type:$('#f2').value,duration_min:+$('#f3').value||null,distance_km:+$('#f4').value||null});closeSheet();toast('Erfasst ✓');if(CUR==='body')go(CUR);});}
function importWorkout(){
  formSheet('Training importieren',
    `<div style="font-size:13px;color:var(--muted)">Lade eine Datei hoch (Text/CSV/JSON-Export deiner Gym-App) ODER füge den Text direkt ein – Alfred parst Übungen & Sätze automatisch.</div>
     <label class="soft" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:14px;cursor:pointer;border:1px dashed var(--line)">📎 Datei wählen<input id="ffile" type="file" accept=".txt,.csv,.json,.md,.log,text/*" style="display:none"></label>
     <div id="ffname" style="font-size:12px;color:#a5b4fc;text-align:center"></div>
     <div style="text-align:center;font-size:11px;color:var(--muted)">– oder –</div>
     <textarea id="f1" rows="6" placeholder="Push Day\nBankdrücken 5x5 @80kg\nSchrägbank KH 3x10 @28kg\nDips 3x12"></textarea>`,
    async()=>{
      const btn=$('#fsave');let text=$('#f1').value.trim();
      const f=$('#ffile').files[0];
      if(f && !text){ text=await f.text(); }
      if(!text){toast('Bitte Datei oder Text angeben');return;}
      btn.textContent='Parse…';btn.disabled=true;
      const r=await post('/api/fitness/import',{text});
      closeSheet();if(r.error)toast('Fehler: '+r.error);else toast('Importiert ✓');if(CUR==='body')go(CUR);
    });
  $('#ffile').addEventListener('change',e=>{const f=e.target.files[0];if(f)$('#ffname').textContent='✓ '+f.name;});
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
