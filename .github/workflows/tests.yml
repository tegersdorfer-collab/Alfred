name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          # Schlankes, in einem frischen venv validiertes Set: die Tests mocken DB/
          # Netz/LLM, und die schweren Voice-/ML-Pakete (piper/whisper/onnx) werden
          # lazy geladen — ihre Tests skippen sich per importorskip, wenn sie fehlen.
          pip install -r requirements-test.txt

      - name: Tests
        run: pytest -q --disable-warnings
