<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Alfred</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="hud">
      <canvas id="hud-particles" width="480" height="480"></canvas>
      <div id="hud-ring-wrap">
        <svg id="hud-bezel" viewBox="0 0 160 160">
          <g id="hud-bezel-ticks"></g>
        </svg>
        <div id="hud-ring"></div>
      </div>
      <div id="hud-info-panel">
        <div id="hud-label"></div>
        <div id="hud-status"></div>
      </div>
    </div>
    <div id="widget-area" style="display:none"></div>
    <div id="voice-status" style="position:absolute;bottom:8px;right:8px;font-size:10px;color:#00e5ff88;font-family:'SF Mono',monospace;max-width:300px;text-align:right;white-space:pre-line;z-index:5"></div>
    <div id="chat-status" style="position:absolute;bottom:44px;left:8px;font-size:10px;color:#00e5ff88;font-family:'SF Mono',monospace;max-width:300px;text-align:left;white-space:pre-line;z-index:5"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
